#===============================================================================#
#         GITHUB ACTIONS WORKFLOW: Claude Planning Stage                       #
#                                                                               #
# Triggered when @claude is mentioned on a NEW issue (or fresh comment on      #
# an issue). Claude analyzes the request and posts a PLAN ONLY, with no code   #
# changes. Only the repo owner can trigger this.                               #
#===============================================================================#

name: Claude Plan

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  plan:
    # Only trigger if:
    # 1. Sender is the repo owner (prevent unauthorized Claude credit spending)
    # 2. Comment/issue mentions @claude
    # 3. Not already in implementation phase (no label)
    if: |
      github.event.sender.login == github.repository_owner && (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, '@claude') &&
         !contains(github.event.issue.labels.*.name, 'claude:plan-ready') &&
         !contains(github.event.issue.labels.*.name, 'claude:pr-created'))
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude - Planning Stage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            You are in PLANNING MODE ONLY. Do NOT make any code changes.

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            Request:
            ```
            ${{ github.event.issue.body }}
            ```

            Your task:
            1. Explore the codebase to understand the current structure
            2. Analyze what the issue is asking for
            3. Propose a structured implementation plan (NOT the code itself)

            Format your response as:
            - **Approach**: High-level strategy
            - **Files to modify**: List specific paths (e.g., src/main/java/com/example/...)
            - **Key changes**: 1-2 sentence summary of each file's role
            - **Testing strategy**: What should be tested
            - **Risks**: Any edge cases or concerns

            End with: "Reply with '@claude implement' to approve this plan and begin implementation."

          claude_args: '--allowedTools "Read" --allowedTools "Glob" --allowedTools "Grep" --disallowedTools "Bash" --disallowedTools "Edit" --disallowedTools "Write"'

      - name: Add plan-ready label
        if: success()
        run: gh issue edit ${{ github.event.issue.number }} --add-label claude:plan-ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
