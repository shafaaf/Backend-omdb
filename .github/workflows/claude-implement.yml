#===============================================================================#
#         GITHUB ACTIONS WORKFLOW: Claude Implementation Stage                 #
#===============================================================================#
#
# PURPOSE:
#   Claude executes the plan from the previous stage. It builds the code,
#   runs tests, boots the app, captures UI screenshots, and opens a PR.
#   DOES NOT MERGE (you stay in control of that).
#
# HOW IT WORKS:
#   1. You comment "@claude implement" on an issue with a plan
#   2. This workflow triggers (only if issue has "claude:plan-ready" label)
#   3. Pre-setup installs Java, Node, frontend dependencies, Playwright
#   4. Claude gets the plan from the issue and implements it
#   5. Claude runs tests (backend + frontend)
#   6. Claude boots the backend + frontend dev servers (using JWT_SECRET, OMDB_API_KEY)
#   7. Claude uses Playwright to take screenshots of affected UI
#   8. Claude stops servers, pushes branch, opens PR with screenshots
#   9. PR stays open for your review (Claude explicitly does NOT merge)
#
# SAFETY FEATURES:
#   - Requires "claude:plan-ready" label (gates: only after plan approved)
#   - Owner-only trigger: no random people can approve implementation
#   - Explicit merge blockers: --disallowedTools "Bash(gh pr merge*)"
#     Even though Claude gets full Bash access, we explicitly prevent merge commands
#   - Full tests run: backend + frontend (via tests.yml as independent CI)
#   - Screenshots embedded in PR so you see the UI changes before approving merge
#
# SETUP STEPS (run before Claude starts):
#   - Java 21 (Temurin) for backend
#   - Node 20 for frontend
#   - npm ci (clean install of frontend dependencies)
#   - Playwright + chromium (for taking screenshots)
#
# REQUIRED SECRETS:
#   - CLAUDE_CODE_OAUTH_TOKEN (GitHub secret, already set)
#   - JWT_SECRET (needed to boot backend; get from your .env)
#   - OMDB_API_KEY (needed to boot backend; get from your .env)
#
# TRIGGER CONDITIONS (all must be true):
#   - github.event.sender.login == github.repository_owner (only you)
#   - Comment contains "@claude implement"
#   - Issue has label "claude:plan-ready" (proof plan was posted)
#   - Comment is on an issue, not a PR
#
# OUTPUT:
#   - New branch: issue-<number>-impl
#   - PR linked to issue with title "Implement #<number>"
#   - Screenshots of affected UI in PR body
#   - Test results visible in PR (backend-tests + frontend-tests jobs)
#   - Issue labeled changed from "claude:plan-ready" to "claude:pr-created"
#
#===============================================================================#

name: Claude Implement

on:
  issue_comment:
    types: [created]

jobs:
  implement:
    # Only trigger if:
    # 1. Sender is repo owner
    # 2. Comment says "@claude implement"
    # 3. Issue has been planned (has label)
    if: |
      github.event.sender.login == github.repository_owner &&
      contains(github.event.comment.body, '@claude implement') &&
      contains(github.event.issue.labels.*.name, 'claude:plan-ready') &&
      !github.event.issue.pull_request

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Claude - Implementation Stage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            You are in IMPLEMENTATION MODE. Execute the plan from issue #${{ github.event.issue.number }}.

            You MUST:
            1. Create a new branch: git checkout -b issue-${{ github.event.issue.number }}-impl
            2. Implement the changes outlined in the plan
            3. Run backend tests: ./mvnw test
            4. Run frontend tests: cd frontend && npx vitest run && npm run lint
            5. Boot the application servers in background (provide JWT_SECRET and OMDB_API_KEY via env)
            6. Use Playwright to screenshot the relevant UI (save to .github/pr-previews/${{ github.event.issue.number }}/)
            7. Stop the servers
            8. Push the branch
            9. Open a PR using: gh pr create --title "Implement #${{ github.event.issue.number }}" --body "Closes #${{ github.event.issue.number }}\n\n## Screenshots\n$(cat .github/pr-previews/${{ github.event.issue.number }}/screenshots.md || echo 'See screenshots in files below')"

            NEVER merge the PR. Leave that for manual review and the @claude merge command.

            If tests fail, explain why and suggest fixes, but do NOT skip the PR creation.

          claude_args: |
            --allowedTools "Bash"
            --allowedTools "Read"
            --allowedTools "Edit"
            --allowedTools "Write"
            --disallowedTools "Bash(gh pr merge*)"
            --disallowedTools "Bash(git push*main)"

        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}

      - name: Update label
        if: success()
        run: |
          gh issue edit ${{ github.event.issue.number }} --remove-label claude:plan-ready --add-label claude:pr-created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
