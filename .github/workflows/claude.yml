#===============================================================================#
#              GITHUB ACTIONS WORKFLOW: Claude Interactive Assistant          #
#                                                                               #
# This workflow makes Claude respond when you @mention them in GitHub:        #
# - Comments on issues or pull requests                                        #
# - Pull request reviews                                                       #
# Claude will read the context and respond to your request.                    #
#===============================================================================#

# WORKFLOW METADATA
# Display name in GitHub Actions tab
name: Claude Code

# TRIGGER EVENTS: When does this workflow run?
on:
  # Trigger 1: Comment on an issue
  issue_comment:
    types: [created]  # When a new comment is posted to an issue

  # Trigger 2: Comment on a PR review
  pull_request_review_comment:
    types: [created]  # When a new comment is posted on a PR review

  # Trigger 3: PR review submission
  pull_request_review:
    types: [submitted]  # When someone submits a PR review

  # NOTE: New issues with @claude are handled by claude-plan.yml (planning stage)
  # This workflow only handles follow-up comments/reviews, not new issue creation

# JOBS: The actual work
jobs:
  claude:
    # CONDITIONAL: Only run if someone mentions @claude
    # This prevents Claude from running on EVERY comment/review
    # The logic checks if '@claude' appears in the relevant field based on event type
    #
    # NOTE: New issues with @claude are NOT handled here — claude-plan.yml takes those.
    # This workflow only handles follow-up comments on existing issues/PRs + PR reviews.
    #
    # NOTE: comments must stay OUTSIDE this expression block - GitHub Actions parses
    # everything under 'if: |' as a single expression, and '#' is not valid inside one.
    #   Case 1: Issue comment (e.g., "@claude fix this")
    #   Case 2: PR review comment (e.g., "@claude why did they do this?")
    #   Case 3: PR review body (e.g., review message that mentions "@claude")
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    # Environment: Run on GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # PERMISSIONS: What this workflow is allowed to do
    permissions:
      contents: read        # Can read the repo code
      pull-requests: read   # Can read PR details
      issues: read          # Can read issue details
      id-token: write       # Can authenticate with GitHub's token
      actions: read         # Can read CI/CD workflow results (needed to display test failures, build status)

    # STEPS: Sequential tasks
    steps:
      # Step 1: Clone the repository
      # fetch-depth: 1 = only download the latest commit (fast and sufficient)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Step 2: Run Claude to respond to the @mention
      # Claude reads the context and replies based on your comment
      - name: Run Claude Code
        id: claude  # Step ID for reference in later steps
        uses: anthropics/claude-code-action@v1
        with:
          # OAuth token for Claude Code authentication
          # Generated in GitHub repo settings > Secrets
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # OPTIONAL: Grant Claude extra permissions
          # 'actions: read' allows Claude to see CI/CD results (test failures, build logs)
          # Useful for: debugging failed tests, analyzing build errors
          additional_permissions: |
            actions: read

          # OPTIONAL: Custom prompt/instruction
          # If NOT set: Claude uses the instructions from your @mention comment
          # If SET: Claude uses this prompt instead (ignores your comment)
          # Example: Force Claude to always summarize PRs
          # prompt: 'Update the pull request description to include a summary of changes.'

          # OPTIONAL: Extra CLI arguments for Claude
          # Grant Claude full permissions in ephemeral GitHub Actions environment
          claude_args: '--allowedTools "Bash" --allowedTools "Read" --allowedTools "Edit" --allowedTools "Write"'
